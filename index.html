<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FCFAF7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="退休计划">
<meta name="format-detection" content="telephone=no">
<meta name="apple-touch-fullscreen" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<title>退休计划</title>
<style>
/* ============== 莫兰迪色系 ============== */
:root {
  /* 主色 - 莫兰迪 */
  --color-bg: #FCFAF7;
  --color-card: #FFFFFF;
  --color-text: #4A4A48;
  --color-text-light: #8A8A86;
  --color-border: #ECEAE5;
  --color-divider: #F2F0EB;

  /* 莫兰迪 4 色（低饱和度） */
  --m-blue: #A3B5C9;       /* 工作日程 - 莫兰迪蓝灰 */
  --m-blue-soft: #D6DEE8;
  --m-green: #A8B89E;      /* 排便记录 - 莫兰迪绿 */
  --m-green-soft: #D8E2D2;
  --m-pink: #C9A3B0;       /* 收支记录 - 莫兰迪粉灰 */
  --m-pink-soft: #EAD9DE;
  --m-purple: #9E8FA8;     /* 学术进度 - 莫兰迪紫灰 */
  --m-purple-soft: #D7CFD9;
  --m-orange: #C9A982;     /* 体重记录 - 莫兰迪橙棕 */
  --m-orange-soft: #EADFCB;

  /* 强调色 */
  --color-accent: #8FA68B;
  --color-warn: #D4A373;
  --color-danger: #C97B7B;

  /* 间距 */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;

  /* 阴影 */
  --shadow-soft: 0 2px 8px rgba(80, 70, 60, 0.05);
  --shadow-card: 0 4px 16px rgba(80, 70, 60, 0.06);
}

/* ============== 基础重置 ============== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* ============== 布局 ============== */
.app {
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
}

/* 侧边栏（桌面） */
.sidebar {
  display: none;
  width: 240px;
  background: var(--color-card);
  border-right: 1px solid var(--color-border);
  padding: 32px 16px;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar-header {
  font-size: 20px;
  font-weight: 600;
  color: var(--color-text);
  padding: 0 12px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-header .logo {
  width: 32px; height: 32px;
  background: var(--m-green);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--color-text-light);
  transition: all 0.2s;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  font-size: 15px;
}
.nav-item:hover { background: var(--color-divider); }
.nav-item.active {
  background: var(--color-divider);
  color: var(--color-text);
  font-weight: 500;
}
.nav-item .nav-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

/* 主内容 */
.main {
  flex: 1;
  min-width: 0;
  padding: 20px;
  padding-bottom: 100px;
  max-width: 100%;
}

/* 顶部栏 */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.page-title {
  font-size: 22px;
  font-weight: 600;
  margin: 0;
  color: var(--color-text);
}
.bell {
  position: relative;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--color-card);
  border: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
}
.bell-badge {
  position: absolute;
  top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--color-danger);
  border-radius: 50%;
  border: 2px solid var(--color-card);
}

/* ============== 模块 ============== */
.module { display: none; animation: fadeIn 0.3s ease; }
.module.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card {
  background: var(--color-card);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--shadow-soft);
  margin-bottom: 16px;
  border: 1px solid var(--color-border);
}

.module-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text);
}
.module-title-emoji {
  width: 32px; height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* ============== 工作日程 ============== */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  background: var(--m-blue-soft);
  border-radius: var(--radius-md);
  padding: 12px 16px;
}
.date-nav-btn {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--m-blue);
  padding: 4px 10px;
  border-radius: 8px;
}
.date-nav-btn:active { background: rgba(255,255,255,0.5); }
.date-nav-current {
  font-weight: 600;
  color: #5A6B7E;
  font-size: 15px;
}

.task-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.task-input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 15px;
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
  min-width: 0;
}
.task-input:focus { border-color: var(--m-blue); }
.task-add-btn {
  background: var(--m-blue);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  padding: 0 18px;
  font-size: 16px;
  font-weight: 500;
}
.task-add-btn:active { transform: scale(0.96); }
.task-batch-btn {
  background: var(--m-blue-soft);
  color: var(--m-blue);
  border: none;
  border-radius: var(--radius-md);
  padding: 0 14px;
  font-size: 18px;
}
.task-batch-btn:active { transform: scale(0.96); background: var(--m-blue); color: white; }

/* 批量添加弹窗 */
.batch-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(80, 70, 60, 0.35);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
.batch-modal {
  background: var(--color-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--color-border);
}
.batch-modal-title {
  margin: 0 0 16px;
  font-size: 17px;
  font-weight: 600;
  color: var(--color-text);
}
.batch-field {
  margin-bottom: 14px;
}
.batch-field label {
  display: block;
  font-size: 13px;
  color: var(--color-text-light);
  margin-bottom: 6px;
}
.batch-field input[type="text"],
.batch-field input[type="date"] {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 15px;
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
}
.batch-field input[type="text"]:focus,
.batch-field input[type="date"]:focus { border-color: var(--m-blue); }
.batch-date-range {
  display: flex;
  align-items: center;
  gap: 8px;
}
.batch-date-range input { flex: 1; min-width: 0; }
.batch-date-range span {
  font-size: 13px;
  color: var(--color-text-light);
  flex-shrink: 0;
}
.batch-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.batch-weekday {
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  padding: 10px 0;
  font-size: 13px;
  color: var(--color-text-light);
  transition: all 0.2s;
}
.batch-weekday.active {
  background: var(--m-blue);
  color: white;
  border-color: var(--m-blue);
  font-weight: 600;
}
.batch-preview {
  font-size: 13px;
  color: var(--color-text-light);
  background: var(--color-bg);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  margin-bottom: 16px;
  text-align: center;
}
.batch-actions {
  display: flex;
  gap: 10px;
}
.batch-actions button {
  flex: 1;
  padding: 12px 0;
  border-radius: var(--radius-md);
  font-size: 15px;
  border: none;
  cursor: pointer;
}
.batch-btn-cancel { background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); }
.batch-btn-confirm { background: var(--m-blue); color: white; }
.batch-btn-confirm:active { transform: scale(0.96); }

.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--color-divider);
}
.task-item:last-child { border-bottom: none; }
.task-checkbox {
  width: 22px; height: 22px;
  border: 2px solid var(--m-blue);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  background: white;
  transition: all 0.2s;
}
.task-checkbox.checked {
  background: var(--m-blue);
  color: white;
}
.task-checkbox.checked::after { content: "✓"; font-size: 14px; font-weight: bold; }
.task-text {
  flex: 1;
  font-size: 15px;
  word-break: break-all;
}
.task-item.done .task-text { text-decoration: line-through; color: var(--color-text-light); }
.task-delete {
  background: none;
  border: none;
  color: var(--color-text-light);
  font-size: 18px;
  padding: 4px 8px;
}
.task-delete:active { color: var(--color-danger); }

.empty-hint {
  text-align: center;
  color: var(--color-text-light);
  padding: 30px 20px;
  font-size: 14px;
}

/* ============== 视图切换 Tabs ============== */
.view-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  background: var(--color-card);
  border-radius: var(--radius-md);
  padding: 4px;
  border: 1px solid var(--color-border);
}
.view-tab {
  flex: 1;
  background: transparent;
  border: none;
  padding: 8px 0;
  border-radius: 10px;
  font-size: 13px;
  color: var(--color-text-light);
  transition: all 0.2s;
}
.view-tab.active {
  background: var(--m-blue-soft);
  color: #5A6B7E;
  font-weight: 600;
}

/* 日程周视图 */
.schedule-week-day {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--color-divider);
  cursor: pointer;
}
.schedule-week-day:last-child { border-bottom: none; }
.schedule-week-day-header {
  flex-shrink: 0;
  width: 56px;
  text-align: center;
}
.schedule-week-day-num {
  font-size: 18px;
  font-weight: 600;
  color: var(--color-text);
}
.schedule-week-day-name {
  font-size: 11px;
  color: var(--color-text-light);
  margin-top: 2px;
}
.schedule-week-day.today .schedule-week-day-num {
  color: var(--m-blue);
  background: var(--m-blue-soft);
  border-radius: 8px;
  padding: 2px 0;
}
.schedule-week-day-content {
  flex: 1;
  min-width: 0;
}
.schedule-week-day-summary {
  font-size: 13px;
  color: var(--color-text-light);
  margin-bottom: 4px;
}
.schedule-week-day-tasks {
  font-size: 13px;
  color: var(--color-text);
  line-height: 1.5;
}
.schedule-week-task {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}
.schedule-week-task-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.schedule-week-task-dot.done { background: var(--m-blue); }
.schedule-week-task-dot.undone { background: var(--color-text-light); opacity: 0.4; }
.schedule-week-task-text { flex: 1; min-width: 0; word-break: break-all; }
.schedule-week-task.done .schedule-week-task-text {
  text-decoration: line-through;
  color: var(--color-text-light);
}

/* 日程月视图 */
.schedule-month-legend {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--color-text-light);
  justify-content: center;
}
.legend-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
.schedule-month-cell {
  position: relative;
}
.schedule-month-cell .cell-tasks {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 2px;
}
.schedule-month-cell .cell-tasks .dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--m-blue);
}
.schedule-month-cell.all-done .cell-tasks .dot { background: var(--m-blue); opacity: 0.5; }
.schedule-month-cell.has-tasks { background: var(--m-blue-soft); }
.schedule-month-cell.all-done { background: var(--m-blue); color: white; }
.schedule-month-cell.all-done .cell-tasks .dot { background: white; }

/* 收支月视图 */
.finance-day-cell {
  position: relative;
  cursor: pointer;
}
.finance-day-cell .cell-amount {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: #6E4856;
  font-weight: 600;
  white-space: nowrap;
  background: rgba(255,255,255,0.75);
  padding: 0 2px;
  border-radius: 3px;
  max-width: 90%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.finance-day-cell.has-amount { background: var(--m-pink-soft); }
.finance-day-cell.today.has-amount { box-shadow: inset 0 0 0 2px var(--m-pink); }

/* 月视图共享：复用 bowel-grid 但允许覆盖 */
#schedule-month-grid .bowel-day,
#finance-month-grid .bowel-day {
  cursor: pointer;
}

/* 收支月视图日详情 */
.finance-day-detail {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--color-divider);
  display: none;
}
.finance-day-detail.show { display: block; }
.finance-day-detail-title {
  font-size: 14px;
  font-weight: 600;
  color: #6E4856;
  margin-bottom: 8px;
}
.finance-day-detail-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--color-divider);
}
.finance-day-detail-item:last-child { border-bottom: none; }
.finance-day-detail-empty {
  color: var(--color-text-light);
  font-size: 13px;
  text-align: center;
  padding: 12px 0;
}

/* ============== 体重记录 ============== */
.weight-month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  background: var(--m-orange-soft);
  border-radius: var(--radius-md);
  padding: 12px 16px;
}
.weight-month-title {
  font-weight: 600;
  color: #6B5B3A;
  font-size: 16px;
}
.weight-month-btn {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--m-orange);
  padding: 4px 10px;
}
.weight-chart-wrap {
  position: relative;
  background: var(--color-bg);
  border-radius: var(--radius-md);
  padding: 12px 8px;
  min-height: 200px;
  margin-bottom: 14px;
}
#weight-chart {
  width: 100%;
  height: 200px;
  display: block;
}
.weight-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-light);
  font-size: 14px;
  pointer-events: none;
}
.weight-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.weight-stat {
  flex: 1;
  min-width: 70px;
  background: var(--m-orange-soft);
  border-radius: var(--radius-md);
  padding: 10px;
  text-align: center;
}
.weight-stat-value {
  font-size: 18px;
  font-weight: 600;
  color: #6B5B3A;
}
.weight-stat-label {
  font-size: 11px;
  color: var(--color-text-light);
  margin-top: 2px;
}
.weight-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.weight-date-input {
  flex: 0 0 auto;
  padding: 12px 12px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 14px;
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
}
.weight-date-input:focus { border-color: var(--m-orange); }
.weight-value-input {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 15px;
  background: var(--color-bg);
  color: var(--color-text);
  outline: none;
}
.weight-value-input:focus { border-color: var(--m-orange); }
.weight-add-btn {
  background: var(--m-orange);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  padding: 0 18px;
  font-size: 16px;
  font-weight: 500;
}
.weight-add-btn:active { transform: scale(0.96); }
.weight-list { list-style: none; padding: 0; margin: 0; }
.weight-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--color-divider);
}
.weight-item:last-child { border-bottom: none; }
.weight-date-badge {
  background: var(--m-orange-soft);
  color: #6B5B3A;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  flex-shrink: 0;
}
.weight-value {
  flex: 1;
  font-weight: 600;
  color: #6B5B3A;
  font-size: 16px;
}
.weight-diff {
  font-size: 12px;
  color: var(--color-text-light);
}
.weight-diff.up { color: var(--color-danger); }
.weight-diff.down { color: var(--color-accent); }
.weight-delete {
  background: none;
  border: none;
  color: var(--color-text-light);
  font-size: 18px;
  padding: 4px 8px;
}

/* ============== 排便记录 ============== */
.bowel-month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.bowel-month-title {
  font-weight: 600;
  font-size: 16px;
  color: #5C6B5A;
}
.bowel-month-btn {
  background: none;
  border: none;
  font-size: 20px;
  color: var(--m-green);
  padding: 4px 12px;
}
.bowel-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
.bowel-grid-head {
  text-align: center;
  font-size: 12px;
  color: var(--color-text-light);
  padding: 6px 0;
  font-weight: 500;
}
.bowel-day {
  aspect-ratio: 1;
  border-radius: 10px;
  background: var(--m-green-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--color-text);
  cursor: pointer;
  position: relative;
  transition: all 0.15s;
  user-select: none;
}
.bowel-day.empty { background: transparent; cursor: default; }
.bowel-day.today { box-shadow: inset 0 0 0 2px var(--m-green); font-weight: 600; }
.bowel-day.checked { background: var(--m-green); color: white; font-weight: 600; }
.bowel-day:not(.empty):not(.checked):active { transform: scale(0.92); }

.bowel-stats {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}
.bowel-stat {
  flex: 1;
  background: var(--m-green-soft);
  border-radius: var(--radius-md);
  padding: 12px;
  text-align: center;
}
.bowel-stat-value {
  font-size: 22px;
  font-weight: 600;
  color: #5C6B5A;
}
.bowel-stat-label {
  font-size: 12px;
  color: var(--color-text-light);
  margin-top: 2px;
}

/* ============== 收支记录 ============== */
.finance-month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--m-pink-soft);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 14px;
}
.finance-month-title {
  font-weight: 600;
  color: #6E4856;
  font-size: 16px;
}
.finance-month-btn {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--m-pink);
  padding: 4px 10px;
}

.finance-total {
  background: var(--m-pink-soft);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 14px;
  text-align: center;
}
.finance-total-label {
  font-size: 13px;
  color: #6E4856;
  opacity: 0.8;
}
.finance-total-amount {
  font-size: 30px;
  font-weight: 700;
  color: #6E4856;
  margin-top: 4px;
}
.finance-total-amount.warn { color: var(--color-warn); }
.finance-total-amount.over { color: var(--color-danger); }

.finance-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.finance-amount-input {
  width: 110px;
  padding: 12px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 15px;
  background: var(--color-bg);
  outline: none;
  flex-shrink: 0;
}
.finance-amount-input:focus { border-color: var(--m-pink); }
.finance-note-input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: 15px;
  background: var(--color-bg);
  outline: none;
  min-width: 0;
}
.finance-note-input:focus { border-color: var(--m-pink); }
.finance-add-btn {
  background: var(--m-pink);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  padding: 0 18px;
  font-size: 16px;
}

.finance-list { list-style: none; padding: 0; margin: 0; }
.finance-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--color-divider);
}
.finance-item:last-child { border-bottom: none; }
.finance-date-badge {
  background: var(--m-pink-soft);
  color: #6E4856;
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  flex-shrink: 0;
}
.finance-note {
  flex: 1;
  color: var(--color-text);
  word-break: break-all;
}
.finance-amount {
  font-weight: 600;
  color: #6E4856;
  font-size: 16px;
  flex-shrink: 0;
}
.finance-delete {
  background: none;
  border: none;
  color: var(--color-text-light);
  font-size: 18px;
  padding: 4px 8px;
}

/* ============== 学术进度 ============== */
.academic-status-filter {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.academic-status-chip {
  background: var(--color-divider);
  border: none;
  border-radius: 16px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--color-text-light);
  white-space: nowrap;
  flex-shrink: 0;
}
.academic-status-chip.active {
  background: var(--m-purple);
  color: white;
}

.academic-add-card {
  background: var(--m-purple-soft);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 14px;
}
.academic-add-card h4 {
  margin: 0 0 12px;
  font-size: 14px;
  color: #4F4760;
  font-weight: 600;
}
.academic-field {
  margin-bottom: 10px;
}
.academic-field label {
  display: block;
  font-size: 12px;
  color: var(--color-text-light);
  margin-bottom: 4px;
}
.academic-field input,
.academic-field select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 10px;
  font-size: 14px;
  background: rgba(255,255,255,0.7);
  outline: none;
  color: var(--color-text);
}
.academic-field input:focus,
.academic-field select:focus { border-color: var(--m-purple); }
.academic-save-btn {
  background: var(--m-purple);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 14px;
  margin-top: 4px;
}

.academic-list { list-style: none; padding: 0; margin: 0; }
.academic-item {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  position: relative;
}
.academic-item-header {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
.academic-item-title {
  flex: 1;
  font-weight: 600;
  font-size: 15px;
  word-break: break-all;
}
.academic-item-journal {
  font-size: 13px;
  color: var(--color-text-light);
  margin-bottom: 8px;
}
.academic-item-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--color-text-light);
}
.academic-status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 500;
}
.status-idea { background: #EAE4DC; color: #6E6258; }
.status-writing { background: var(--m-purple-soft); color: #4F4760; }
.status-submitted { background: #DDD8C8; color: #6B6240; }
.status-review { background: #D6DEE8; color: #4A5A6E; }
.status-published { background: var(--m-green-soft); color: #4A5C42; }
.academic-link {
  color: var(--m-purple);
  text-decoration: none;
  word-break: break-all;
}
.academic-delete {
  position: absolute;
  top: 12px; right: 12px;
  background: none;
  border: none;
  color: var(--color-text-light);
  font-size: 16px;
  padding: 4px;
}

/* ============== 提醒中心 ============== */
.notification-panel {
  position: fixed;
  top: 0; right: 0;
  width: 100%;
  max-width: 360px;
  height: 100vh;
  background: var(--color-bg);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 0.3s;
  box-shadow: -4px 0 16px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
}
.notification-panel.open { transform: translateX(0); }
.notification-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--color-border);
  background: var(--color-card);
}
.notification-panel-header h3 { margin: 0; font-size: 17px; }
.notification-panel-close {
  background: none;
  border: none;
  font-size: 22px;
  color: var(--color-text-light);
}
.notification-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.notification-item {
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
}
.notification-item.unread { border-left: 3px solid var(--m-green); }
.notification-item-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 4px;
}
.notification-item-body {
  font-size: 13px;
  color: var(--color-text-light);
  line-height: 1.5;
}
.notification-item-time {
  font-size: 11px;
  color: var(--color-text-light);
  margin-top: 6px;
  opacity: 0.7;
}

/* 通知权限横幅 */
.permission-banner {
  background: var(--m-green-soft);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.permission-banner-text {
  flex: 1;
  font-size: 13px;
  color: #5C6B5A;
}
.permission-banner-btn {
  background: var(--m-green);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  white-space: nowrap;
}
.permission-banner-close {
  background: none;
  border: none;
  font-size: 18px;
  color: var(--color-text-light);
}

/* ============== 底部 Tab（移动端） ============== */
.bottom-nav {
  display: flex;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--color-card);
  border-top: 1px solid var(--color-border);
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav-item {
  flex: 1;
  background: none;
  border: none;
  padding: 8px 2px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--color-text-light);
  font-size: 10px;
  min-width: 0;
  overflow: hidden;
}
.bottom-nav-item .nav-icon {
  width: 26px; height: 26px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: transparent;
  transition: all 0.2s;
}
.bottom-nav-item.active { color: var(--color-text); font-weight: 500; }
.bottom-nav-item.active .nav-icon {
  background: var(--color-divider);
}

/* ============== 响应式 ============== */
@media (min-width: 768px) {
  .sidebar { display: flex; }
  .bottom-nav { display: none; }
  .main { padding: 28px 32px; padding-bottom: 32px; }
  .permission-banner-text { font-size: 14px; }
}
@media (max-width: 767px) {
  .sidebar { display: none; }
  .bottom-nav { display: flex; }
  .topbar { margin-top: 8px; }
}

/* ============== Toast ============== */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(74, 74, 72, 0.92);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  white-space: nowrap;
  max-width: 80vw;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

</style>
</head>
<body>

<div class="app">
  <!-- 桌面侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">🍵</div>
      退休计划
    </div>
    <button class="nav-item active" data-tab="schedule" onclick="switchTab('schedule')">
      <span class="nav-icon" style="background: var(--m-blue-soft);">📋</span>
      <span>工作日程</span>
    </button>
    <button class="nav-item" data-tab="finance" onclick="switchTab('finance')">
      <span class="nav-icon" style="background: var(--m-pink-soft);">💰</span>
      <span>收支记录</span>
    </button>
    <button class="nav-item" data-tab="weight" onclick="switchTab('weight')">
      <span class="nav-icon" style="background: var(--m-orange-soft);">⚖️</span>
      <span>体重记录</span>
    </button>
    <button class="nav-item" data-tab="academic" onclick="switchTab('academic')">
      <span class="nav-icon" style="background: var(--m-purple-soft);">📚</span>
      <span>学术进度</span>
    </button>
    <button class="nav-item" data-tab="bowel" onclick="switchTab('bowel')">
      <span class="nav-icon" style="background: var(--m-green-soft);">🚽</span>
      <span>排便记录</span>
    </button>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <!-- 顶栏 -->
    <div class="topbar">
      <h1 class="page-title" id="page-title">📋 工作日程</h1>
      <button class="bell" onclick="toggleNotifications()" aria-label="通知">
        🔔
        <span class="bell-badge" id="bell-badge" style="display:none;"></span>
      </button>
    </div>

    <!-- 通知权限提示 -->
    <div class="permission-banner" id="permission-banner" style="display:none;">
      <span>🔔</span>
      <span class="permission-banner-text">开启通知权限，以便接收日程和打卡提醒</span>
      <button class="permission-banner-btn" onclick="requestNotificationPermission()">开启</button>
      <button class="permission-banner-close" onclick="dismissPermissionBanner()">×</button>
    </div>

    <!-- ============= 工作日程模块 ============= -->
    <section class="module active" id="module-schedule">
      <!-- 视图切换 -->
      <div class="view-tabs">
        <button class="view-tab active" data-sview="day" onclick="setScheduleView('day')">日视图</button>
        <button class="view-tab" data-sview="week" onclick="setScheduleView('week')">周视图</button>
        <button class="view-tab" data-sview="month" onclick="setScheduleView('month')">月视图</button>
      </div>

      <!-- 日视图 -->
      <div class="card" id="schedule-day-view">
        <div class="date-nav">
          <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
          <span class="date-nav-current" id="schedule-date-display"></span>
          <button class="date-nav-btn" onclick="changeDate(1)">›</button>
        </div>
        <div class="task-input-row">
          <input type="text" class="task-input" id="task-input" placeholder="添加今天的任务..." onkeydown="if(event.key==='Enter')addTask()">
          <button class="task-add-btn" onclick="addTask()">+</button>
          <button class="task-batch-btn" onclick="openBatchAdd()">🗓</button>
        </div>
        <ul class="task-list" id="task-list"></ul>
      </div>

      <!-- 批量添加弹窗 -->
      <div class="batch-modal-overlay" id="batch-modal" style="display:none;" onclick="if(event.target===this)closeBatchAdd()">
        <div class="batch-modal" onclick="event.stopPropagation()">
          <h3 class="batch-modal-title">批量添加日程</h3>
          <div class="batch-field">
            <label>活动内容</label>
            <input type="text" id="batch-task-input" placeholder="例如：晨跑 30 分钟" onkeydown="if(event.key==='Enter')submitBatchAdd()">
          </div>
          <div class="batch-field">
            <label>重复日期范围</label>
            <div class="batch-date-range">
              <input type="date" id="batch-start-date">
              <span>至</span>
              <input type="date" id="batch-end-date">
            </div>
          </div>
          <div class="batch-field">
            <label>重复星期</label>
            <div class="batch-weekdays" id="batch-weekdays">
              <button class="batch-weekday" data-d="1" onclick="toggleBatchWeekday(1)">一</button>
              <button class="batch-weekday" data-d="2" onclick="toggleBatchWeekday(2)">二</button>
              <button class="batch-weekday" data-d="3" onclick="toggleBatchWeekday(3)">三</button>
              <button class="batch-weekday" data-d="4" onclick="toggleBatchWeekday(4)">四</button>
              <button class="batch-weekday" data-d="5" onclick="toggleBatchWeekday(5)">五</button>
              <button class="batch-weekday" data-d="6" onclick="toggleBatchWeekday(6)">六</button>
              <button class="batch-weekday" data-d="0" onclick="toggleBatchWeekday(0)">日</button>
            </div>
          </div>
          <div class="batch-preview" id="batch-preview"></div>
          <div class="batch-actions">
            <button class="batch-btn-cancel" onclick="closeBatchAdd()">取消</button>
            <button class="batch-btn-confirm" onclick="submitBatchAdd()">确认添加</button>
          </div>
        </div>
      </div>

      <!-- 周视图 -->
      <div class="card" id="schedule-week-view" style="display:none;">
        <div class="date-nav">
          <button class="date-nav-btn" onclick="changeScheduleWeek(-1)">‹</button>
          <span class="date-nav-current" id="schedule-week-display"></span>
          <button class="date-nav-btn" onclick="changeScheduleWeek(1)">›</button>
        </div>
        <div id="schedule-week-list"></div>
      </div>

      <!-- 月视图 -->
      <div class="card" id="schedule-month-view" style="display:none;">
        <div class="date-nav">
          <button class="date-nav-btn" onclick="changeScheduleMonth(-1)">‹</button>
          <span class="date-nav-current" id="schedule-month-display"></span>
          <button class="date-nav-btn" onclick="changeScheduleMonth(1)">›</button>
        </div>
        <div class="bowel-grid" id="schedule-month-grid"></div>
        <div class="schedule-month-legend">
          <span class="legend-dot" style="background:var(--m-blue);"></span>有任务
          <span class="legend-dot" style="background:var(--m-blue-soft);border:1px solid var(--m-blue);"></span>全部完成
        </div>
      </div>
    </section>

    <!-- ============= 排便记录模块 ============= -->
    <section class="module" id="module-bowel">
      <div class="card">
        <h3 class="module-title">
          <span class="module-title-emoji" style="background: var(--m-green-soft);">🚽</span>
          排便打卡
        </h3>
        <div class="bowel-month-nav">
          <button class="bowel-month-btn" onclick="changeBowelMonth(-1)">‹</button>
          <span class="bowel-month-title" id="bowel-month-title"></span>
          <button class="bowel-month-btn" onclick="changeBowelMonth(1)">›</button>
        </div>
        <div class="bowel-grid" id="bowel-grid"></div>
        <div class="bowel-stats">
          <div class="bowel-stat">
            <div class="bowel-stat-value" id="bowel-stat-count">0</div>
            <div class="bowel-stat-label">本月次数</div>
          </div>
          <div class="bowel-stat">
            <div class="bowel-stat-value" id="bowel-stat-streak">0</div>
            <div class="bowel-stat-label">连续天数</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============= 收支记录模块 ============= -->
    <section class="module" id="module-finance">
      <!-- 视图切换 -->
      <div class="view-tabs">
        <button class="view-tab active" data-fview="list" onclick="setFinanceView('list')" style="background:var(--m-pink-soft);color:#6E4856;font-weight:600;">列表视图</button>
        <button class="view-tab" data-fview="month" onclick="setFinanceView('month')">月视图</button>
      </div>
      <div class="card">
        <div class="finance-month-nav">
          <button class="finance-month-btn" onclick="changeFinanceMonth(-1)">‹</button>
          <span class="finance-month-title" id="finance-month-title"></span>
          <button class="finance-month-btn" onclick="changeFinanceMonth(1)">›</button>
        </div>
        <div class="finance-total">
          <div class="finance-total-label">本月支出</div>
          <div class="finance-total-amount" id="finance-total-amount">¥0.00</div>
        </div>
        <!-- 列表视图 -->
        <div id="finance-list-view">
          <div class="finance-input-row">
            <input type="number" class="finance-amount-input" id="finance-amount-input" placeholder="金额" step="0.01" min="0">
            <input type="text" class="finance-note-input" id="finance-note-input" placeholder="备注" onkeydown="if(event.key==='Enter')addExpense()">
            <button class="finance-add-btn" onclick="addExpense()">+</button>
          </div>
          <ul class="finance-list" id="finance-list"></ul>
          <!-- 编辑弹窗 -->
          <div class="batch-modal-overlay" id="finance-edit-modal" style="display:none;" onclick="if(event.target===this)closeFinanceEdit()">
            <div class="batch-modal" onclick="event.stopPropagation()">
              <h3 class="batch-modal-title">编辑支出</h3>
              <div class="batch-field">
                <label>金额</label>
                <input type="number" id="edit-finance-amount" step="0.01" min="0" onkeydown="if(event.key==='Enter')saveFinanceEdit()">
              </div>
              <div class="batch-field">
                <label>备注</label>
                <input type="text" id="edit-finance-note" onkeydown="if(event.key==='Enter')saveFinanceEdit()">
              </div>
              <div class="batch-field">
                <label>日期</label>
                <input type="date" id="edit-finance-date">
              </div>
              <div class="batch-actions">
                <button class="batch-btn-cancel" onclick="closeFinanceEdit()">取消</button>
                <button class="batch-btn-confirm" onclick="saveFinanceEdit()">保存</button>
              </div>
            </div>
          </div>
        </div>
        <!-- 月视图 -->
        <div id="finance-month-view" style="display:none;">
          <div class="bowel-grid" id="finance-month-grid"></div>
          <div class="schedule-month-legend">
            <span class="legend-dot" style="background:var(--m-pink-soft);border:1px solid var(--m-pink);"></span>有支出
          </div>
          <div class="finance-day-detail" id="finance-day-detail"></div>
        </div>
      </div>
    </section>

    <!-- ============= 体重记录模块 ============= -->
    <section class="module" id="module-weight">
      <div class="card">
        <h3 class="module-title">
          <span class="module-title-emoji" style="background: var(--m-orange-soft);">⚖️</span>
          体重记录
        </h3>

    <span>体重</span>
  </button>

    <span>学术</span>

<!-- 通知抽屉 -->
<div class="notification-panel" id="notification-panel">
  <div class="notification-panel-header">
    <h3>🔔 通知中心</h3>
    <button class="notification-panel-close" onclick="toggleNotifications()">×</button>
  </div>
  <div class="notification-list" id="notification-list"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============== 工具 ============== */
const $ = (id) => document.getElementById(id);
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const monthStr = (date = new Date()) =>
  `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
const parseDate = (s) => {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
};
const fmtDate = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const weekdayCN = (date) => ['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
const weekdayShortCN = (date) => ['日','一','二','三','四','五','六'][date.getDay()];
const STORE = {
  get(k, def) {
    try { const v = localStorage.getItem('rp_'+k); return v === null ? def : JSON.parse(v); }
    catch { return def; }
  },
  set(k, v) { localStorage.setItem('rp_'+k, JSON.stringify(v)); }
};

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============== Tab 切换 ============== */
let currentTab = 'schedule';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
  $('module-'+tab).classList.add('active');
  document.querySelectorAll('.sidebar .nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === tab);
  });
  document.querySelectorAll('.bottom-nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.tab === tab);
  });
  const titles = { schedule: '📋 工作日程', bowel: '🚽 排便记录', finance: '💰 收支记录', weight: '⚖️ 体重记录', academic: '📚 学术进度' };
  $('page-title').textContent = titles[tab];
  if (tab === 'bowel') renderBowel();
  if (tab === 'finance') renderFinance();
  if (tab === 'weight') renderWeight();
  if (tab === 'academic') renderAcademic();
}

/* ============== 工作日程 ============== */
let scheduleDate = new Date();
let scheduleView = 'day';
let scheduleWeekRef = new Date();   // 周视图参考日期
let scheduleMonthRef = new Date();   // 月视图参考日期

function changeDate(delta) {
  scheduleDate.setDate(scheduleDate.getDate() + delta);
  renderSchedule();
}
function setScheduleView(v) {
  scheduleView = v;
  document.querySelectorAll('[data-sview]').forEach(b => {
    b.classList.toggle('active', b.dataset.sview === v);
  });
  $('schedule-day-view').style.display = (v === 'day') ? 'block' : 'none';
  $('schedule-week-view').style.display = (v === 'week') ? 'block' : 'none';
  $('schedule-month-view').style.display = (v === 'month') ? 'block' : 'none';
  if (v === 'week') renderScheduleWeek();
  if (v === 'month') renderScheduleMonth();
}
// 周一为一周开始
function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day); // 周日归到上周
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function changeScheduleWeek(delta) {
  scheduleWeekRef.setDate(scheduleWeekRef.getDate() + delta * 7);
  renderScheduleWeek();
}
function renderScheduleWeek() {
  const start = startOfWeek(scheduleWeekRef);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  $('schedule-week-display').textContent =
    `${start.getMonth()+1}月${start.getDate()}日 - ${end.getMonth()+1}月${end.getDate()}日`;
  const container = $('schedule-week-list');
  container.innerHTML = '';
  const today = todayStr();
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const key = fmtDate(d);
    const tasks = STORE.get('tasks_'+key, []);
    const doneCount = tasks.filter(t => t.done).length;
    const isToday = (key === today);
    const dayDiv = document.createElement('div');
    dayDiv.className = 'schedule-week-day' + (isToday ? ' today' : '');
    let tasksHtml = '';
    if (tasks.length) {
      tasksHtml = tasks.slice(0, 4).map(t =>
        `<div class="schedule-week-task ${t.done?'done':''}">
          <span class="schedule-week-task-dot ${t.done?'done':'undone'}"></span>
          <span class="schedule-week-task-text">${escapeHtml(t.text)}</span>
        </div>`
      ).join('') + (tasks.length > 4 ? `<div class="schedule-week-task" style="color:var(--color-text-light);font-size:12px;">+${tasks.length-4} 更多</div>` : '');
    } else {
      tasksHtml = '<div style="color:var(--color-text-light);font-size:12px;">—</div>';
    }
    const summary = tasks.length ? `共 ${tasks.length} 项，已完成 ${doneCount}` : '暂无任务';
    dayDiv.innerHTML = `
      <div class="schedule-week-day-header">
        <div class="schedule-week-day-num">${d.getDate()}</div>
        <div class="schedule-week-day-name">${weekdayShortCN(d)}${isToday?'<br>今天':''}</div>
      </div>
      <div class="schedule-week-day-content">
        <div class="schedule-week-day-summary">${summary}</div>
        <div class="schedule-week-day-tasks">${tasksHtml}</div>
      </div>
    `;
    dayDiv.onclick = () => {
      scheduleDate = new Date(d);
      setScheduleView('day');
      renderSchedule();
    };
    container.appendChild(dayDiv);
  }
}
function changeScheduleMonth(delta) {
  scheduleMonthRef.setMonth(scheduleMonthRef.getMonth() + delta);
  renderScheduleMonth();
}
function renderScheduleMonth() {
  const year = scheduleMonthRef.getFullYear();
  const month = scheduleMonthRef.getMonth();
  $('schedule-month-display').textContent = `${year}年${month+1}月`;
  const grid = $('schedule-month-grid');
  grid.innerHTML = '';
  ['日','一','二','三','四','五','六'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'bowel-grid-head';
    h.textContent = d;
    grid.appendChild(h);
  });
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeekday = firstDay.getDay();
  const days = lastDay.getDate();
  const today = todayStr();
  for (let i = 0; i < startWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'bowel-day empty';
    grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const tasks = STORE.get('tasks_'+dateStr, []);
    const cell = document.createElement('div');
    let cls = 'bowel-day schedule-month-cell';
    if (dateStr === today) cls += ' today';
    if (tasks.length) {
      cls += ' has-tasks';
      if (tasks.every(t => t.done)) cls += ' all-done';
    }
    cell.className = cls;
    cell.textContent = d;
    let dotsHtml = '';
    if (tasks.length) {
      const n = Math.min(tasks.length, 5);
      dotsHtml = '<div class="cell-tasks">' + Array(n).fill('<span class="dot"></span>').join('') + '</div>';
    }
    cell.innerHTML = d + dotsHtml;
    cell.onclick = () => {
      scheduleDate = new Date(year, month, d);
      setScheduleView('day');
      renderSchedule();
    };
    grid.appendChild(cell);
  }
}
function renderSchedule() {
  const key = fmtDate(scheduleDate);
  $('schedule-date-display').textContent = `${scheduleDate.getFullYear()}年${scheduleDate.getMonth()+1}月${scheduleDate.getDate()}日 ${weekdayCN(scheduleDate)}${key===todayStr()?' · 今天':''}`;
  const tasks = STORE.get('tasks_'+key, []);
  const list = $('task-list');
  list.innerHTML = '';
  if (!tasks.length) {
    list.innerHTML = '<div class="empty-hint">还没有任务，添加一个吧 ☕</div>';
    return;
  }
  tasks.forEach((t, idx) => {
    const li = document.createElement('li');
    li.className = 'task-item' + (t.done ? ' done' : '');
    li.innerHTML = `
      <div class="task-checkbox ${t.done?'checked':''}" onclick="toggleTask(${idx})"></div>
      <span class="task-text">${escapeHtml(t.text)}</span>
      <button class="task-delete" onclick="deleteTask(${idx})">×</button>
    `;
    list.appendChild(li);
  });
}
function addTask() {
  const input = $('task-input');
  const text = input.value.trim();
  if (!text) return;
  const key = fmtDate(scheduleDate);
  const tasks = STORE.get('tasks_'+key, []);
  tasks.push({ text, done: false, ts: Date.now() });
  STORE.set('tasks_'+key, tasks);
  input.value = '';
  renderSchedule();
}

let selectedBatchWeekdays = new Set();
function openBatchAdd() {
  selectedBatchWeekdays = new Set();
  document.querySelectorAll('.batch-weekday').forEach(b => b.classList.remove('active'));
  $('batch-modal').style.display = 'flex';
  // 默认范围：本周到未来 4 周
  const start = new Date(scheduleDate);
  const end = new Date(start);
  end.setDate(end.getDate() + 28);
  $('batch-start-date').value = fmtDate(start);
  $('batch-end-date').value = fmtDate(end);
  $('batch-task-input').value = '';
  $('batch-task-input').focus();
  updateBatchPreview();
}
function closeBatchAdd() {
  $('batch-modal').style.display = 'none';
}
function toggleBatchWeekday(d) {
  const btns = document.querySelectorAll('.batch-weekday');
  const btn = [...btns].find(b => Number(b.dataset.d) === d);
  if (selectedBatchWeekdays.has(d)) {
    selectedBatchWeekdays.delete(d);
    btn.classList.remove('active');
  } else {
    selectedBatchWeekdays.add(d);
    btn.classList.add('active');
  }
  updateBatchPreview();
}
function updateBatchPreview() {
  const text = $('batch-task-input').value.trim();
  const start = $('batch-start-date').value;
  const end = $('batch-end-date').value;
  const days = selectedBatchWeekdays.size;
  let count = 0;
  if (start && end && days > 0) {
    const s = parseDate(start);
    const e = parseDate(end);
    for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
      if (selectedBatchWeekdays.has(d.getDay())) count++;
    }
  }
  $('batch-preview').textContent =
    text ? `将为 ${count} 个日期添加「${text}」` : `将覆盖 ${count} 个日期`;
}
$('batch-task-input').addEventListener('input', updateBatchPreview);
$('batch-start-date').addEventListener('change', updateBatchPreview);
$('batch-end-date').addEventListener('change', updateBatchPreview);
function submitBatchAdd() {
  const text = $('batch-task-input').value.trim();
  const start = $('batch-start-date').value;
  const end = $('batch-end-date').value;
  if (!text) { toast('请输入活动内容'); return; }
  if (!start || !end) { toast('请选择日期范围'); return; }
  if (selectedBatchWeekdays.size === 0) { toast('请至少选择一个星期'); return; }
  const s = parseDate(start);
  const e = parseDate(end);
  if (s > e) { toast('开始日期不能晚于结束日期'); return; }
  let added = 0;
  for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
    if (selectedBatchWeekdays.has(d.getDay())) {
      const key = fmtDate(d);
      const tasks = STORE.get('tasks_'+key, []);
      tasks.push({ text, done: false, ts: Date.now() });
      STORE.set('tasks_'+key, tasks);
      added++;
    }
  }
  closeBatchAdd();
  toast(`已添加 ${added} 个日程`);
  renderSchedule();
  if (scheduleView === 'week') renderScheduleWeek();
  if (scheduleView === 'month') renderScheduleMonth();
}
function toggleTask(idx) {
  const key = fmtDate(scheduleDate);
  const tasks = STORE.get('tasks_'+key, []);
  tasks[idx].done = !tasks[idx].done;
  STORE.set('tasks_'+key, tasks);
  renderSchedule();
}
function deleteTask(idx) {
  const key = fmtDate(scheduleDate);
  const tasks = STORE.get('tasks_'+key, []);
  tasks.splice(idx, 1);
  STORE.set('tasks_'+key, tasks);
  renderSchedule();
}

/* ============== 排便记录 ============== */
let bowelMonth = new Date();
function changeBowelMonth(delta) {
  bowelMonth.setMonth(bowelMonth.getMonth() + delta);
  renderBowel();
}
function renderBowel() {
  $('bowel-month-title').textContent = `${bowelMonth.getFullYear()}年${bowelMonth.getMonth()+1}月`;
  const grid = $('bowel-grid');
  grid.innerHTML = '';
  // 星期头
  ['日','一','二','三','四','五','六'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'bowel-grid-head';
    h.textContent = d;
    grid.appendChild(h);
  });
  const year = bowelMonth.getFullYear();
  const month = bowelMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeekday = firstDay.getDay();
  const days = lastDay.getDate();
  const records = STORE.get('bowel', {});
  // 前面空格
  for (let i = 0; i < startWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'bowel-day empty';
    grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = document.createElement('div');
    let cls = 'bowel-day';
    if (dateStr === todayStr()) cls += ' today';
    if (records[dateStr]) cls += ' checked';
    cell.className = cls;
    cell.textContent = d;
    if (!cell.classList.contains('empty')) {
      cell.onclick = () => toggleBowel(dateStr);
    }
    grid.appendChild(cell);
  }
  // 统计
  let count = 0;
  let streak = 0;
  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}-`;
  for (const k in records) {
    if (k.startsWith(monthPrefix)) count++;
  }
  // 连续天数（从今天往前数）
  const today = new Date();
  for (let i = 0; i < 60; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    if (records[fmtDate(d)]) streak++;
    else break;
  }
  $('bowel-stat-count').textContent = count;
  $('bowel-stat-streak').textContent = streak;
}
function toggleBowel(dateStr) {
  const records = STORE.get('bowel', {});
  if (records[dateStr]) delete records[dateStr];
  else records[dateStr] = true;
  STORE.set('bowel', records);
  renderBowel();
}

/* ============== 收支记录 ============== */
let financeMonth = new Date();
let financeView = 'list';
let financeSelectedDay = null;  // 月视图中选中的日期

function changeFinanceMonth(delta) {
  financeMonth.setMonth(financeMonth.getMonth() + delta);
  renderFinance();
}
function setFinanceView(v) {
  financeView = v;
  document.querySelectorAll('[data-fview]').forEach(b => {
    const active = b.dataset.fview === v;
    b.classList.toggle('active', active);
    b.style.background = active ? 'var(--m-pink-soft)' : '';
    b.style.color = active ? '#6E4856' : '';
    b.style.fontWeight = active ? '600' : '';
  });
  $('finance-list-view').style.display = (v === 'list') ? 'block' : 'none';
  $('finance-month-view').style.display = (v === 'month') ? 'block' : 'none';
  if (v === 'month') renderFinanceMonth();
}
function renderFinance() {
  const mKey = monthStr(financeMonth);
  $('finance-month-title').textContent = `${financeMonth.getFullYear()}年${financeMonth.getMonth()+1}月`;
  const allExpenses = STORE.get('expenses', {});
  const items = allExpenses[mKey] || [];
  const total = items.reduce((s, e) => s + Number(e.amount), 0);
  const totalEl = $('finance-total-amount');
  totalEl.textContent = `¥${total.toFixed(2)}`;
  totalEl.classList.remove('warn', 'over');
  if (total >= 1000) totalEl.classList.add('over');
  else if (total >= 800) totalEl.classList.add('warn');
  // 列表视图
  const list = $('finance-list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty-hint">本月还没有记录 🌱</div>';
  } else {
    const sorted = items.slice().sort((a,b) => (b.date+b.ts).localeCompare(a.date+a.ts));
    sorted.forEach((e) => {
      const li = document.createElement('li');
      li.className = 'finance-item';
      li.style.cursor = 'pointer';
      li.onclick = () => openFinanceEdit(e.id);
      const day = e.date.slice(-2);
      li.innerHTML = `
        <span class="finance-date-badge">${parseInt(day)}日</span>
        <span class="finance-note">${escapeHtml(e.note || '—')}</span>
        <span class="finance-amount">¥${Number(e.amount).toFixed(2)}</span>
        <button class="finance-delete" onclick="event.stopPropagation();deleteExpense('${mKey}', '${e.id}')">×</button>
      `;
      list.appendChild(li);
    });
  }
  // 月视图
  if (financeView === 'month') renderFinanceMonth();
}
function renderFinanceMonth() {
  const year = financeMonth.getFullYear();
  const month = financeMonth.getMonth();
  const mKey = monthStr(financeMonth);
  const allExpenses = STORE.get('expenses', {});
  const items = allExpenses[mKey] || [];
  // 按日期聚合
  const byDay = {};
  items.forEach(e => {
    if (!byDay[e.date]) byDay[e.date] = { total: 0, items: [] };
    byDay[e.date].total += Number(e.amount);
    byDay[e.date].items.push(e);
  });
  const grid = $('finance-month-grid');
  grid.innerHTML = '';
  ['日','一','二','三','四','五','六'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'bowel-grid-head';
    h.textContent = d;
    grid.appendChild(h);
  });
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startWeekday = firstDay.getDay();
  const days = lastDay.getDate();
  const today = todayStr();
  for (let i = 0; i < startWeekday; i++) {
    const e = document.createElement('div');
    e.className = 'bowel-day empty';
    grid.appendChild(e);
  }
  for (let d = 1; d <= days; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = document.createElement('div');
    let cls = 'bowel-day finance-day-cell';
    if (dateStr === today) cls += ' today';
    const dayData = byDay[dateStr];
    if (dayData) {
      cls += ' has-amount';
      cell.innerHTML = `${d}<div class="cell-amount">¥${dayData.total.toFixed(2)}</div>`;
    } else {
      cell.textContent = d;
    }
    cell.className = cls;
    if (dayData) {
      cell.onclick = () => showFinanceDayDetail(dateStr, dayData);
    } else {
      cell.onclick = () => showFinanceDayDetail(dateStr, null);
    }
    if (financeSelectedDay === dateStr) {
      cell.style.boxShadow = 'inset 0 0 0 2px var(--m-pink)';
    }
    grid.appendChild(cell);
  }
}
function showFinanceDayDetail(dateStr, dayData) {
  financeSelectedDay = dateStr;
  renderFinanceMonth();
  const detail = $('finance-day-detail');
  const d = parseDate(dateStr);
  const title = `${d.getMonth()+1}月${d.getDate()}日 ${weekdayCN(d)}`;
  if (!dayData) {
    detail.innerHTML = `<div class="finance-day-detail-title">${title}</div><div class="finance-day-detail-empty">当日无支出</div>`;
  } else {
    const itemsHtml = dayData.items.map(e =>
      `<div class="finance-day-detail-item">
        <span>${escapeHtml(e.note || '—')}</span>
        <span style="font-weight:600;color:#6E4856;">¥${Number(e.amount).toFixed(2)}</span>
      </div>`
    ).join('');
    detail.innerHTML = `
      <div class="finance-day-detail-title">${title} · 共 ¥${dayData.total.toFixed(2)}</div>
      ${itemsHtml}
    `;
  }
  detail.classList.add('show');
}
function addExpense() {

  });

function deleteExpense(mKey, id) {
  const all = STORE.get('expenses', {});

  STORE.set('expenses', all);

}
// 编辑支出
let editingExpenseId = null;
function openFinanceEdit(id) {
  // 找到这笔记录
  const all = STORE.get('expenses', {});
  let target = null, targetMKey = null;
  for (const k in all) {
    const found = all[k].find(e => e.id === id);
    if (found) { target = found; targetMKey = k; break; }
  }
  if (!target) return;
  editingExpenseId = id;
  $('edit-finance-amount').value = target.amount;
  $('edit-finance-note').value = target.note || '';
  $('edit-finance-date').value = target.date;
  $('finance-edit-modal').style.display = 'flex';
  $('edit-finance-amount').focus();
}
function closeFinanceEdit() {
  $('finance-edit-modal').style.display = 'none';
  editingExpenseId = null;
}
function saveFinanceEdit() {
  if (!editingExpenseId) return;
  const amount = $('edit-finance-amount').value;
  const note = $('edit-finance-note').value.trim();
  const date = $('edit-finance-date').value;
  if (!amount || Number(amount) <= 0) { toast('请输入有效金额'); return; }
  if (!date) { toast('请选择日期'); return; }
  const all = STORE.get('expenses', {});
  // 找到原记录
  let oldMKey = null, idx = -1;
  for (const k in all) {
    const i = all[k].findIndex(e => e.id === editingExpenseId);
    if (i >= 0) { oldMKey = k; idx = i; break; }
  }
  if (oldMKey === null) { toast('记录不存在'); closeFinanceEdit(); return; }
  // 新月份 key
  const newMKey = monthStr(parseDate(date));
  // 从旧月份移除
  const moved = all[oldMKey].splice(idx, 1)[0];
  if (all[oldMKey].length === 0) delete all[oldMKey];
  // 更新字段
  moved.amount = Number(amount);
  moved.note = note;
  moved.date = date;
  moved.ts = Date.now();
  // 放到新月份
  if (!all[newMKey]) all[newMKey] = [];
  all[newMKey].push(moved);
  STORE.set('expenses', all);
  closeFinanceEdit();
  // 跳到新月份显示
  financeMonth = parseDate(date);
  renderFinance();
  toast('已保存');
}

/* ============== 体重记录 ============== */
let weightMonth = new Date();
function changeWeightMonth(delta) {
  weightMonth.setMonth(weightMonth.getMonth() + delta);
  renderWeight();
}
function renderWeight() {
  const year = weightMonth.getFullYear();
  const month = weightMonth.getMonth();
  $('weight-month-title').textContent = `${year}年${month+1}月`;
  const allW = STORE.get('weights', {});
  // 收集当月记录，按日期排序
  const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}`;
  const items = Object.entries(allW)
    .filter(([d]) => d.startsWith(monthPrefix))
    .map(([d, v]) => ({ date: d, value: v }))
    .sort((a, b) => a.date.localeCompare(b.date));
  // 渲染折线图
  renderWeightChart(items);
  // 渲染列表
  renderWeightList(items);
  // 渲染统计
  renderWeightStats(items);
}
function renderWeightChart(items) {
  const svg = $('weight-chart');
  const empty = $('weight-empty');
  if (!items.length) {
    svg.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  const W = 320, H = 200;
  const padL = 38, padR = 14, padT = 18, padB = 28;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  // 数值范围
  const values = items.map(i => i.value);
  let vmin = Math.min(...values);
  let vmax = Math.max(...values);
  const range = vmax - vmin || 1;
  // 给 y 轴留一点空间
  vmin = vmin - range * 0.15;
  vmax = vmax + range * 0.15;
  // x 轴按日期索引均匀分布
  const n = items.length;
  const xOf = (i) => n === 1 ? padL + innerW / 2 : padL + (innerW * i) / (n - 1);
  const yOf = (v) => padT + innerH * (1 - (v - vmin) / (vmax - vmin));
  let svgStr = '';
  // 网格线 + y 轴标签（4 条）
  for (let i = 0; i <= 4; i++) {
    const y = padT + (innerH * i) / 4;
    const v = vmax - (vmax - vmin) * (i / 4);
    svgStr += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#ECEAE5" stroke-width="1" stroke-dasharray="3,3"/>`;
    svgStr += `<text x="${padL - 6}" y="${y + 3}" font-size="9" fill="#8A8A86" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  // x 轴标签（首尾 + 中间）
  const labelIdx = new Set();
  labelIdx.add(0);
  labelIdx.add(n - 1);
  if (n >= 4) labelIdx.add(Math.floor((n - 1) / 2));
  labelIdx.forEach(i => {
    const x = xOf(i);
    const d = items[i].date.slice(8);  // 取日
    svgStr += `<text x="${x}" y="${H - 8}" font-size="9" fill="#8A8A86" text-anchor="middle">${parseInt(d)}日</text>`;
  });
  // 折线（直线点状）
  let points = items.map((it, i) => `${xOf(i)},${yOf(it.value)}`).join(' ');
  svgStr += `<polyline points="${points}" fill="none" stroke="#C9A982" stroke-width="2" stroke-linejoin="round"/>`;
  // 点 + 数值标签
  items.forEach((it, i) => {
    const x = xOf(i);
    const y = yOf(it.value);
    svgStr += `<circle cx="${x}" cy="${y}" r="3" fill="#C9A982" stroke="white" stroke-width="1.5"/>`;
    // 只在间隔够大时显示数值，避免重叠
    if (n <= 8 || labelIdx.has(i)) {
      svgStr += `<text x="${x}" y="${y - 8}" font-size="9" fill="#6B5B3A" text-anchor="middle">${it.value}</text>`;
    }
  });
  svg.innerHTML = svgStr;
}
function renderWeightList(items) {
  const list = $('weight-list');
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="empty-hint">还没有体重记录 ⚖️</div>';
    return;
  }
  const reversed = items.slice().reverse();  // 倒序显示（最新在上）
  reversed.forEach((it, i) => {
    // 与上一条对比（原顺序的下一条）
    const origIdx = items.length - 1 - i;
    const prev = items[origIdx - 1];
    let diffHtml = '';
    if (prev) {
      const diff = it.value - prev.value;
      if (diff > 0) diffHtml = `<span class="weight-diff up">↑${diff.toFixed(1)}</span>`;
      else if (diff < 0) diffHtml = `<span class="weight-diff down">↓${Math.abs(diff).toFixed(1)}</span>`;
      else diffHtml = `<span class="weight-diff">—</span>`;
    }
    const li = document.createElement('li');
    li.className = 'weight-item';
    const d = parseDate(it.date);
    li.innerHTML = `
      <span class="weight-date-badge">${d.getMonth()+1}月${d.getDate()}日</span>
      <span class="weight-value">${it.value} kg</span>
      ${diffHtml}
      <button class="weight-delete" onclick="deleteWeight('${it.date}')">×</button>
    `;
    list.appendChild(li);
  });
}
function renderWeightStats(items) {
  const stats = $('weight-stats');
  if (!items.length) {
    stats.innerHTML = '';
    return;
  }
  const values = items.map(i => i.value);
  const first = items[0].value;
  const last = items[items.length - 1].value;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const avg = (values.reduce((s, v) => s + v, 0) / values.length).toFixed(1);
  const diff = (last - first).toFixed(1);
  const diffSign = diff > 0 ? '+' : '';
  const diffClass = diff > 0 ? 'up' : (diff < 0 ? 'down' : '');
  stats.innerHTML = `
    <div class="weight-stat">
      <div class="weight-stat-value">${last}</div>
      <div class="weight-stat-label">最新 kg</div>
    </div>
    <div class="weight-stat">
      <div class="weight-stat-value">${min}~${max}</div>
      <div class="weight-stat-label">范围</div>
    </div>
    <div class="weight-stat">
      <div class="weight-stat-value">${avg}</div>
      <div class="weight-stat-label">平均</div>
    </div>
    <div class="weight-stat">
      <div class="weight-stat-value">${diffSign}${diff}</div>
      <div class="weight-stat-label">月变化</div>
    </div>
  `;
}
function addWeight() {
  const date = $('weight-date-input').value;
  const value = $('weight-value-input').value;
  if (!date) { toast('请选择日期'); return; }
  if (!value || Number(value) <= 0) { toast('请输入有效体重'); return; }
  const all = STORE.get('weights', {});
  all[date] = Number(value);
  STORE.set('weights', all);
  $('weight-value-input').value = '';
  // 跳转到数据所在月份
  weightMonth = parseDate(date);
  renderWeight();
}
function deleteWeight(date) {
  const all = STORE.get('weights', {});
  delete all[date];
  STORE.set('weights', all);
  renderWeight();
}

/* ============== HTML 转义 ============== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============== 通知系统 ============== */
let notifications = STORE.get('notifications', []);
function updateBellBadge() {
  const unread = notifications.filter(n => !n.read).length;
  $('bell-badge').style.display = unread > 0 ? 'block' : 'none';
}
function addNotification(title, body, key) {
  // 防重复（按 key + 日期去重）
  const todayK = todayStr();
  const fullKey = todayK + '_' + key;
  if (notifications.some(n => n.dedupKey === fullKey)) return;
  const n = {
    id: 'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    title, body,
    time: new Date().toISOString(),
    read: false,
    dedupKey: fullKey
  };
  notifications.unshift(n);
  if (notifications.length > 50) notifications = notifications.slice(0, 50);
  STORE.set('notifications', notifications);
  updateBellBadge();
  // 系统通知
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, icon: 'icon-192.png' }); } catch(e) {}
  }
  // 应用内提醒
  toast(`${title}: ${body}`);
}
function renderNotifications() {
  const list = $('notification-list');
  list.innerHTML = '';
  if (!notifications.length) {
    list.innerHTML = '<div class="empty-hint">暂无通知 🌿</div>';
    return;
  }
  notifications.forEach(n => {
    const div = document.createElement('div');
    div.className = 'notification-item' + (n.read ? '' : ' unread');
    const t = new Date(n.time);
    const timeStr = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    div.innerHTML = `
      <div class="notification-item-title">${escapeHtml(n.title)}</div>
      <div class="notification-item-body">${escapeHtml(n.body)}</div>
      <div class="notification-item-time">${timeStr}</div>
    `;
    list.appendChild(div);
  });
  // 标记为已读
  notifications.forEach(n => n.read = true);
  STORE.set('notifications', notifications);
  updateBellBadge();
}
function toggleNotifications() {
  const p = $('notification-panel');
  const isOpen = p.classList.toggle('open');
  if (isOpen) renderNotifications();
}

/* ============== 通知权限 ============== */
function checkNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    $('permission-banner').style.display = 'flex';
  } else {
    $('permission-banner').style.display = 'none';
  }
}
function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(p => {
    $('permission-banner').style.display = (p === 'default') ? 'flex' : 'none';
    if (p === 'granted') toast('通知已开启 🔔');
  });
}
function dismissPermissionBanner() {
  $('permission-banner').style.display = 'none';
}

/* ============== 提醒检查 ============== */
function checkReminders() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const today = todayStr();

  // 1. 次日日程提醒（17:00-23:59 之间）
  if (h >= 17 && h <= 23) {
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowKey = fmtDate(tomorrow);
    const tasks = STORE.get('tasks_'+tomorrowKey, []);
    const undone = tasks.filter(t => !t.done);
    if (undone.length > 0) {
      addNotification(
        '📋 明日日程提醒',
        `明天有 ${undone.length} 项任务：${undone.slice(0,3).map(t=>t.text).join('、')}${undone.length>3?'…':''}`,
        'tomorrow_tasks'
      );
    }
  }

  // 2. 排便打卡提醒（21:00-23:59 之间，且今天未打卡）
  if (h >= 21 && h <= 23) {
    const records = STORE.get('bowel', {});
    if (!records[today]) {
      addNotification('🚽 排便打卡', '还没打卡哦，记得记录一下今日排便情况～', 'bowel_today');
    }
  }

  // 3. 收支超额提醒（当月累计首次超过 1000）
  const mKey = monthStr();
  const allExp = STORE.get('expenses', {});
  const items = allExp[mKey] || [];
  const total = items.reduce((s, e) => s + Number(e.amount), 0);
  if (total > 1000) {
    addNotification(
      '💰 月度支出提醒',
      `本月已支出 ¥${total.toFixed(2)}，超过 1000 元预算，请注意节流`,
      'finance_over'
    );
  }
}

/* ============== 初始化 ============== */
function init() {
  renderSchedule();
  renderBowel();
  renderFinance();
  renderWeight();
  renderAcademic();
  // 体重默认日期为今天
  $('weight-date-input').value = todayStr();
  updateBellBadge();
  checkNotificationPermission();
  // 立即检查一次（避免刚打开错过当日提醒）
  // 不在打开时立刻弹，仅靠定时器轮询
  // 每分钟检查一次
  setInterval(checkReminders, 60000);
  checkReminders();

  // Service Worker（PWA）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

init();
